server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  # /privacy and /privacy.html both answer, so the listing URL has no way to rot
  location = /privacy { try_files /privacy.html =404; }
  location = /imprint { try_files /imprint.html =404; }
  # clean guide URLs: /guides/ and /guides/<slug>/ serve the .html files
  location = /guides { return 301 /guides/; }
  location /guides/ {
    rewrite ^/guides/([a-z0-9-]+)/?$ /guides/$1.html last;
    rewrite ^/guides/$ /guides/index.html last;
  }
  location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }
}
